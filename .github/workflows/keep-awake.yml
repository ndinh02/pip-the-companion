# The Free App Service plan sleeps after ~20 minutes without visitors, and waking it takes ~40 s.
# This pings the health check every 10 minutes so judges get a fast first load. It stops by itself after the
# judging window (AGENTS.md: keep the hosted demo working until 2026-11-10). GitHub may delay scheduled runs.
name: keep-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the hosted demo
        env:
          SITE: https://pip-the-companion-cjcdawd7gmf8f9h2.francecentral-01.azurewebsites.net
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261111 ]; then echo "Judging window over; not pinging."; exit 0; fi
          curl --silent --show-error --fail --retry 3 --retry-delay 10 --max-time 90 "$SITE/healthz"
