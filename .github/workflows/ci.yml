# Checks on every push and pull request; deploys the web app from main once the Azure token secret exists.
# The deploy waits for the web and the Python checks (owner decision 2026-10-26). The `determinism` job (never blocks)
# reports whether the simulation on Linux matches the files committed from the Mac (it drifts by ~1 dm late on).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9" # the code is written for 3.9 (AGENTS.md)

      - name: Match Lab tests (generator, schemas, tracking)
        working-directory: match-lab
        run: python3 -m unittest discover -s tests

      - name: Match Reader tests (cards, facts, copy rules, player stats)
        working-directory: match-reader
        run: python3 -m unittest discover -s tests

      - name: Content workflow tests (checker, retry, fallback, integrity demo)
        working-directory: agents
        run: python3 -m unittest discover -s tests

      - name: Added-time tests
        run: python3 scripts/test_added_time.py

      - name: Full-match QA, seed 43 (the demo match files in data/)
        run: python3 scripts/match_qa.py

      - name: Full-match QA, seeds 1-5 (freshly generated tracking)
        run: |
          out="$RUNNER_TEMP/qa"
          mkdir -p "$out"
          for n in 1 2 3 4 5; do
            echo "=== seed $n ==="
            (cd match-lab && python3 -m matchlab.track --seed "$n" --out-match "$out/m$n.json" --out-tracking "$out/t$n.json")
            python3 scripts/match_qa.py --events "$out/m$n.json" --tracking "$out/t$n.json"
          done

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Copy check (no betting words, no hard-coded numbers) on the match the app plays
        working-directory: web
        run: npm run check:copy

      - name: Copy check on the generated demo match
        working-directory: web
        run: node ../scripts/check-copy.mjs ../data/demo-match.json

      - name: Type-check and build
        working-directory: web
        run: npm run build

      - name: Server tests (rooms, validation, rate limit, security headers)
        working-directory: web
        run: node --test server/server.test.mjs

  determinism:
    # Diagnostic, never blocks: is seed 43 the same match twice on Linux? Findings appear as warnings on the run page.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Run seed 43 several ways and report the first difference
        run: python3 scripts/diag_determinism.py 43

  deploy:
    # Runs only on main, after the checks pass, and only once the publish profile secret and the app name are set.
    # Hosting: Azure App Service (Linux, Node 22, Free F1, France Central). Static Web Apps is not available in the
    # regions this Azure for Students subscription may use (docs/OPEN_QUESTIONS.md).
    needs: [web, python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
    steps:
      - name: Deployment skipped
        if: env.PUBLISH_PROFILE == '' || env.APP_NAME == ''
        run: echo "Set the AZURE_WEBAPP_PUBLISH_PROFILE secret and the AZURE_WEBAPP_NAME variable to deploy."
      - uses: actions/checkout@v4
        if: env.PUBLISH_PROFILE != '' && env.APP_NAME != ''
      - uses: actions/setup-node@v4
        if: env.PUBLISH_PROFILE != '' && env.APP_NAME != ''
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and package (server + built app, no dependencies)
        if: env.PUBLISH_PROFILE != '' && env.APP_NAME != ''
        working-directory: web
        run: |
          npm ci
          npm run build
          rm -rf server/dist
          cp -r dist server/dist
      - name: Deploy to Azure App Service
        if: env.PUBLISH_PROFILE != '' && env.APP_NAME != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: web/server
